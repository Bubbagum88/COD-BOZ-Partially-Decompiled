name: Build APK

on:
  push:
    branches: [master, controller-support]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      # A stable signing key lets each new build install over the last one without
      # uninstalling (which would wipe the app's saves). Set these four repository
      # secrets to enable it; without them the throwaway debug key is used.
      - name: Sign with your own key (when the signing secrets are set)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/boz.jks"
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
              --ks "$RUNNER_TEMP/boz.jks" --ks-pass env:KEYSTORE_PASSWORD \
              --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD \
              --out "boz-${GITHUB_REF_NAME}.apk" "$APK"
            rm "$RUNNER_TEMP/boz.jks"
          else
            echo "::warning::No signing secrets set: built with a throwaway debug key, so installing it means uninstalling the previous build (and its saves) first."
            cp "$APK" "boz-${GITHUB_REF_NAME}-debugkey.apk"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: boz-${{ github.ref_name }}
          path: boz-*.apk
