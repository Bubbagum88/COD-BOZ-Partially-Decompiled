name: Build APK

on:
  push:
    branches: [master, controller-support]
  workflow_dispatch:

jobs:
  build:
    # Pinned so the ubuntu-latest move to Ubuntu 26 cannot change the build unexpectedly.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # The runner image already ships the Android SDK; use its sdkmanager directly.
      - name: Install SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      # gradle.properties is git-ignored upstream; provide the settings the build needs.
      - name: Create gradle.properties
        run: |
          if [ ! -f gradle.properties ]; then
            printf '%s\n' \
              'org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8' \
              'android.useAndroidX=true' \
              'kotlin.code.style=official' > gradle.properties
          fi

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      # A stable signing key lets each new build install over the last one without
      # uninstalling (which would wipe the app's saves). Set these four repository
      # secrets to enable it; without them the throwaway debug key is used.
      - name: Sign with your own key (when the signing secrets are set)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/boz.jks"
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
              --ks "$RUNNER_TEMP/boz.jks" --ks-pass env:KEYSTORE_PASSWORD \
              --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD \
              --out "boz-${GITHUB_REF_NAME}.apk" "$APK"
            rm "$RUNNER_TEMP/boz.jks"
          else
            echo "::warning::No signing secrets set: built with a throwaway debug key, so installing it means uninstalling the previous build (and its saves) first."
            cp "$APK" "boz-${GITHUB_REF_NAME}-debugkey.apk"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: boz-${{ github.ref_name }}
          path: boz-*.apk
